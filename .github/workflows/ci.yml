name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Coq ${{ matrix.version }} / MathComp 2.2.0"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "8.16.1"
            image: mathcomp/mathcomp:2.2.0-coq-8.16@sha256:a73d9bc7cc058a02f69eb74422d45aeb518c993f7a0500c6d7587db6923683b7
          - version: "8.18.0"
            image: mathcomp/mathcomp:2.2.0-coq-8.18@sha256:74242573b1261215d0c01783f2f32adc5fbb982f09c97890aecee98f327e2a1b
          - version: "8.19.2"
            image: mathcomp/mathcomp:2.2.0-coq-8.19@sha256:4528ca6551316685d24b8e4468db981224e7da2507c0d683262363ab50151a86
          - version: "8.20.1"
            image: mathcomp/mathcomp:2.2.0-coq-8.20@sha256:22627a3f9ce8e0670b044465e6e461d4048d8005a4ad919aa73f3eda12ccf8ca
    container:
      image: ${{ matrix.image }}
      # Actions needs access to runner-owned files; build as the image's coq user.
      options: --user 0
    defaults:
      run:
        shell: bash
    steps:
      - name: Inspect container environment before checkout
        run: |
          set -eux
          cat /etc/os-release
          getconf GNU_LIBC_VERSION
          id
          id coq
          printf 'HOME=%s\nGITHUB_WORKSPACE=%s\n' "$HOME" "$GITHUB_WORKSPACE"
          ls -ld "$HOME" /home/coq /home/coq/.opam "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify as coq after root checkout
        run: |
          set -eux
          runuser -u coq -- env HOME=/home/coq SOURCE_DIR="$GITHUB_WORKSPACE" bash --login -c '
            set -eux
            work=$(mktemp -d)
            trap "rm -rf -- \"$work\"" EXIT
            cp -R "$SOURCE_DIR"/. "$work"/
            cd "$work"
            id
            bash scripts/verify.sh
          '
      - name: Check proof files unchanged
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" diff --exit-code HEAD -- theories
