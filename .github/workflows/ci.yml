name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: "Coq ${{ matrix.coq-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        coq-version: ["8.8", "8.9", "8.10", "8.11", "8.12"]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/run-verification.sh ${{ matrix.coq-version }}
