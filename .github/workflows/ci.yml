name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Rocq ${{ matrix.version }} / MathComp 2.6.0"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "9.0.1"
            image: mathcomp/mathcomp:2.6.0-rocq-prover-9.0@sha256:53e9ef2c3d85068a2e4c7db84da72faffcef08351107911bab48117fec3247bb
          - version: "9.1.1"
            image: mathcomp/mathcomp:2.6.0-rocq-prover-9.1@sha256:170e09d5ec507180f9ef93cd9e0ba1b58f422e34df50044462170b26807231b9
          - version: "9.2.0"
            image: mathcomp/mathcomp:2.6.0-rocq-prover-9.2@sha256:a4e066dbe94d40fbbefc2ab7692abb905011a053d1a5434ababee659ffe293e8
          - version: "9.3.0"
            image: mathcomp/mathcomp:2.6.0-rocq-prover-9.3@sha256:6bf12b95e479f557c1a83cbe602975e84155ec8e9676a84403cf23b65f8f9842
    container:
      image: ${{ matrix.image }}
      # Actions needs access to runner-owned files; build as the image's rocq user.
      options: --user 0
    defaults:
      run:
        shell: bash
    steps:
      - name: Inspect container environment before checkout
        run: |
          set -eux
          cat /etc/os-release
          getconf GNU_LIBC_VERSION
          id
          id rocq
          printf 'HOME=%s\nGITHUB_WORKSPACE=%s\n' "$HOME" "$GITHUB_WORKSPACE"
          ls -ld "$HOME" /home/rocq /home/rocq/.opam "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify as rocq after root checkout
        run: |
          set -eux
          runuser -u rocq -- env HOME=/home/rocq SOURCE_DIR="$GITHUB_WORKSPACE" bash --login -c '
            set -eux
            work=$(mktemp -d)
            trap "rm -rf -- \"$work\"" EXIT
            cp -R "$SOURCE_DIR"/. "$work"/
            cd "$work"
            id
            bash scripts/verify.sh
          '
      - name: Check proof files unchanged
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" diff --exit-code HEAD -- theories
