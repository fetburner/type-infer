name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: "Coq ${{ matrix.coq-version }} / MathComp 1.19.0"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        coq-version: ["8.16.1", "8.18.0", "8.19.2"]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/run-verification.sh "${{ matrix.coq-version }}"
